<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <clipPath id="clip"><circle cx="64" cy="64" r="56"/></clipPath>
  </defs>
  <!-- top half black -->
  <path d="M8 64 A56 56 0 0 1 120 64 Z" fill="#1a1a2e" clip-path="url(#clip)"/>
  <!-- yellow U stripe -->
  <path d="M8 64 A56 56 0 0 1 120 64 L114 64 A50 50 0 0 0 14 64 Z" fill="#F0C419" clip-path="url(#clip)"/>
  <!-- bottom half white -->
  <path d="M8 64 A56 56 0 0 0 120 64 Z" fill="#F0EEFF" clip-path="url(#clip)"/>
  <!-- U mark on top -->
  <text x="64" y="50" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="#F0C419" opacity="0.9">U</text>
  <!-- outline -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="#1a1a2e" stroke-width="4"/>
  <!-- center band -->
  <rect x="8" y="60" width="112" height="8" fill="#F0C419" clip-path="url(#clip)"/>
  <!-- button outer -->
  <circle cx="64" cy="64" r="14" fill="#1a1a2e" stroke="#F0C419" stroke-width="2"/>
  <!-- button inner -->
  <circle cx="64" cy="64" r="9" fill="#F0EEFF"/>
  <circle cx="60" cy="60" r="3" fill="white" opacity="0.7"/>
  <ellipse cx="44" cy="38" rx="10" ry="6" fill="white" opacity="0.2" transform="rotate(-20 44 38)"/>
</svg>
