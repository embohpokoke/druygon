<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0618"/>
      <stop offset="100%" stop-color="#150a30"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  
  <!-- circuit grid lines -->
  <line x1="0" y1="180" x2="960" y2="180" stroke="#8B5CF6" stroke-width="1" opacity="0.15"/>
  <line x1="0" y1="360" x2="960" y2="360" stroke="#8B5CF6" stroke-width="1" opacity="0.15"/>
  <line x1="240" y1="0" x2="240" y2="540" stroke="#8B5CF6" stroke-width="1" opacity="0.15"/>
  <line x1="480" y1="0" x2="480" y2="540" stroke="#8B5CF6" stroke-width="1" opacity="0.15"/>
  <line x1="720" y1="0" x2="720" y2="540" stroke="#8B5CF6" stroke-width="1" opacity="0.15"/>
  <!-- glowing nodes -->
  <circle cx="240" cy="180" r="8" fill="#8B5CF6" opacity="0.7"/>
  <circle cx="480" cy="180" r="6" fill="#4A9EFF" opacity="0.6"/>
  <circle cx="720" cy="360" r="8" fill="#8B5CF6" opacity="0.7"/>
  <circle cx="240" cy="360" r="6" fill="#4A9EFF" opacity="0.5"/>
  <!-- data stream arcs -->
  <path d="M240 180 Q360 100 480 180" fill="none" stroke="#4A9EFF" stroke-width="2" opacity="0.4"/>
  <path d="M480 360 Q600 440 720 360" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0.4"/>
  <!-- CPU shapes -->
  <rect x="380" y="200" width="200" height="140" rx="12" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0.3"/>
  <!-- region label -->
  <text x="480" y="250" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="56" font-weight="800" fill="#8B5CF6" opacity="0.9" filter="url(#glow)">Sirkuit Digital</text>
  <text x="480" y="300" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" fill="#8B5CF6" opacity="0.5">Logic & circuits</text>
  <!-- placeholder note -->
  <text x="480" y="490" text-anchor="middle" font-family="monospace" font-size="12" fill="#8B5CF6" opacity="0.3">[ placeholder — replace with: assets/regions/compsci-hero.jpg ]</text>
</svg>