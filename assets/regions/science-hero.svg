<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001a12"/>
      <stop offset="100%" stop-color="#003322"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  
  <circle cx="780" cy="100" r="180" fill="#00D9B8" opacity="0.06"/>
  <circle cx="100" cy="480" r="140" fill="#00D9B8" opacity="0.05"/>
  <!-- bioluminescent plant shapes -->
  <ellipse cx="120" cy="400" rx="40" ry="120" fill="#00D9B8" opacity="0.15" transform="rotate(-10 120 400)"/>
  <ellipse cx="840" cy="350" rx="30" ry="100" fill="#00D9B8" opacity="0.12" transform="rotate(8 840 350)"/>
  <ellipse cx="500" cy="480" rx="200" ry="60" fill="#00D9B8" opacity="0.08"/>
  <!-- floating particles -->
  <circle cx="200" cy="150" r="4" fill="#00D9B8" opacity="0.6"/>
  <circle cx="350" cy="80" r="3" fill="#00D9B8" opacity="0.5"/>
  <circle cx="650" cy="120" r="5" fill="#00D9B8" opacity="0.4"/>
  <circle cx="820" cy="200" r="3" fill="#00D9B8" opacity="0.5"/>
  <circle cx="480" cy="60" r="4" fill="#4ADE80" opacity="0.4"/>
  <!-- region label -->
  <text x="480" y="250" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="56" font-weight="800" fill="#00D9B8" opacity="0.9" filter="url(#glow)">Rimba Sains</text>
  <text x="480" y="300" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" fill="#00D9B8" opacity="0.5">Living-world wilds</text>
  <!-- placeholder note -->
  <text x="480" y="490" text-anchor="middle" font-family="monospace" font-size="12" fill="#00D9B8" opacity="0.3">[ placeholder — replace with: assets/regions/science-hero.jpg ]</text>
</svg>