  <line x1="92" y1="128" x2="122" y2="126" stroke="#FFCB05" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="92" y1="140" x2="122" y2="138" stroke="#FFCB05" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="92" y1="152" x2="118" y2="150" stroke="#FFCB05" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
