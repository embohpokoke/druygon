<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#FFCB05" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFCB05" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="128" cy="128" r="110" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="106" fill="none" stroke="#FFCB05" stroke-width="2.5" stroke-opacity="0.4"/>
