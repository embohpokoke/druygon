  <line x1="134" y1="114" x2="164" y2="116" stroke="#FFCB05" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="134" y1="126" x2="164" y2="128" stroke="#FFCB05" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="134" y1="138" x2="164" y2="140" stroke="#FFCB05" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
