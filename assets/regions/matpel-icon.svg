    <path d="M74 108 Q98 100 116 110 M74 128 Q98 120 116 130 M74 148 Q98 140 116 150" stroke="#FFF3E6" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M140 110 Q158 100 182 108 M140 130 Q158 120 182 128 M140 150 Q158 140 182 148" stroke="#FFF3E6" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>
  <!-- star above the book -->
  <path d="M128 34 L134.5 52 L153 52.5 L138.5 63.5 L144 81.5 L128 71 L112 81.5 L117.5 63.5 L103 52.5 L121.5 52 Z" fill="#FFD06E" filter="url(#glow)"/>
