<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="currentColor" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
    </radialGradient>
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pulseGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="80" cy="80" r="74" fill="url(#glow)"/>
  <circle cx="80" cy="80" r="66" fill="#18152E" stroke="currentColor" stroke-width="3" filter="url(#outerGlow)" opacity="0.9"/>
  <circle cx="80" cy="80" r="55" fill="#110F24" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <circle cx="80" cy="80" r="45" fill="#0C0A1E"/>
  <circle cx="80" cy="80" r="38" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 5" opacity="0.35"/>
  <path d="M72 62 L72 90 L93 76 Z" fill="currentColor" filter="url(#pulseGlow)" opacity="0.85"/>
  <circle cx="80" cy="24" r="3" fill="currentColor" opacity="0.5"/>
</svg>
