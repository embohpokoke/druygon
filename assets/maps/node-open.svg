<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="var(--accent, #00D9B8)" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="var(--accent, #00D9B8)" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- glow halo -->
  <circle cx="80" cy="80" r="76" fill="url(#glow)"/>
  <!-- outer ring -->
  <circle cx="80" cy="80" r="68" fill="#1A1635" stroke="#00D9B8" stroke-width="3" filter="url(#blur)"/>
  <!-- inner circle -->
  <circle cx="80" cy="80" r="50" fill="#120F28" stroke="#00D9B8" stroke-width="2" opacity="0.6"/>
  <!-- pulse ring -->
  <circle cx="80" cy="80" r="40" fill="none" stroke="#00D9B8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>
  <!-- exclamation / ready indicator -->
  <circle cx="80" cy="68" r="6" fill="#00D9B8"/>
  <rect x="76" y="78" width="8" height="16" rx="4" fill="#00D9B8"/>
  <!-- outer shine -->
  <ellipse cx="60" cy="50" rx="12" ry="8" fill="white" opacity="0.08" transform="rotate(-30 60 50)"/>
</svg>
