<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <!-- outer ring -->
  <circle cx="80" cy="80" r="72" fill="#1E1B3A" stroke="#3D3760" stroke-width="3"/>
  <!-- inner circle -->
  <circle cx="80" cy="80" r="54" fill="#16132E" stroke="#2D2952" stroke-width="2"/>
  <!-- lock body -->
  <rect x="58" y="82" width="44" height="32" rx="8" fill="#4B4680" filter="url(#shadow)"/>
  <!-- lock shackle -->
  <path d="M66 82 L66 70 Q66 52 80 52 Q94 52 94 70 L94 82" fill="none" stroke="#4B4680" stroke-width="8" stroke-linecap="round"/>
  <!-- keyhole -->
  <circle cx="80" cy="96" r="6" fill="#2D2952"/>
  <rect x="77" y="96" width="6" height="10" rx="3" fill="#2D2952"/>
  <!-- dim overlay -->
