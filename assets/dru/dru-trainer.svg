  <ellipse cx="288" cy="178" rx="22" ry="23" fill="#F0EEFF"/>
  <ellipse cx="224" cy="180" rx="14" ry="15" fill="#1a0a4e"/>
  <ellipse cx="292" cy="180" rx="14" ry="15" fill="#1a0a4e"/>
  <circle cx="228" cy="174" r="5" fill="white" opacity="0.9"/>
  <circle cx="296" cy="174" r="5" fill="white" opacity="0.9"/>
