<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- body / jacket -->
  <rect x="18" y="36" width="28" height="22" rx="6" fill="#FFCB05"/>
  <!-- collar white -->
  <path d="M28 36 L32 44 L36 36" fill="white" opacity="0.7"/>
  <!-- arms -->
  <rect x="10" y="36" width="10" height="16" rx="5" fill="#FFCB05"/>
  <rect x="44" y="36" width="10" height="16" rx="5" fill="#FFCB05"/>
  <!-- hands -->
  <circle cx="15" cy="53" r="5" fill="#d4956a"/>
  <circle cx="49" cy="53" r="5" fill="#d4956a"/>
  <!-- neck -->
  <rect x="27" y="29" width="10" height="9" rx="3" fill="#d4956a"/>
  <!-- head -->
  <circle cx="32" cy="22" r="13" fill="#d4956a"/>
  <!-- cap brim -->
  <rect x="16" y="17" width="32" height="5" rx="2.5" fill="#c09400"/>
  <!-- cap top -->
  <rect x="20" y="8" width="24" height="12" rx="5" fill="#FFCB05"/>
  <!-- cap button -->
  <circle cx="32" cy="9" r="2" fill="#c09400"/>
  <!-- eyes -->
  <circle cx="27" cy="23" r="2.5" fill="#1a0a4e"/>
  <circle cx="37" cy="23" r="2.5" fill="#1a0a4e"/>
  <circle cx="28" cy="22" r="1" fill="white"/>
  <circle cx="38" cy="22" r="1" fill="white"/>
  <!-- smile -->
  <path d="M28 28 Q32 32 36 28" fill="none" stroke="#c07050" stroke-width="1.5" stroke-linecap="round"/>
  <!-- shoes -->
  <ellipse cx="24" cy="57" rx="7" ry="4" fill="#2a1a4e"/>
  <ellipse cx="40" cy="57" rx="7" ry="4" fill="#2a1a4e"/>
</svg>