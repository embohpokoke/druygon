  <circle cx="92" cy="64" r="4" fill="#8B5CF6" opacity="0.6"/><circle cx="83" cy="83" r="4" fill="#8B5CF6" opacity="0.6"/><circle cx="64" cy="92" r="4" fill="#8B5CF6" opacity="0.6"/><circle cx="44" cy="83" r="4" fill="#8B5CF6" opacity="0.6"/><circle cx="36" cy="64" r="4" fill="#8B5CF6" opacity="0.6"/><circle cx="44" cy="44" r="4" fill="#8B5CF6" opacity="0.6"/><circle cx="63" cy="36" r="4" fill="#8B5CF6" opacity="0.6"/><circle cx="83" cy="44" r="4" fill="#8B5CF6" opacity="0.6"/>
  <!-- letter -->
